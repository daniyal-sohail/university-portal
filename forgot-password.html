<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Forgot Password | DevXcript Student Portal</title>
    <link rel="icon" href="img/logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Onest:wght@100..900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>

<body>
    <div class="auth">
        <div class="inner">
            <div class="text-center mb-4"><img src="img/logo.png" alt="logo" height="56"></div>
            <h1 class="text-center mb-2">Forgot Password</h1>
            <p class="small text-secondary text-center mb-4">Enter your email to receive password reset instructions.
            </p>
            <form id="forgotForm" novalidate class="d-grid gap-3">
                <div><label class="form-label small fw-medium">Email <span class="text-danger">*</span></label><input
                        id="email" type="email" class="form-control" placeholder="info@gmail.com">
                    <div class="invalid-feedback" id="emailErr"></div>
                </div><button class="btn btn-theme py-2">Reset Password</button>
            </form>
            <p id="sent" class="d-none text-center small" style="color:var(--teal-600)">A password reset link has been
                sent to your email.</p>
            <p class="small text-secondary text-center mt-4">Remembered your password? <a href="signin.html"
                    class="link-teal">Sign In</a></p>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>
</body>

</html>
